name: Release

# Runs on every push to main. If the version in pyproject.toml has no GitHub release yet, it builds the .deb and the
# Windows zip and publishes release v<version> with both attached. Bump `version` in pyproject.toml to trigger one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resync_apt:
        description: "Also rebuild the apt repository from the latest GitHub release, even if no new version is needed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi

  deb:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "build/*.deb" }

  # Rebuilds the apt repo (gh-pages/apt) from whatever .deb is attached to the latest GitHub release. Runs after
  # `publish` so a release cut in this same run is already there; also runs standalone (publish skipped) when
  # manually dispatched with resync_apt, so the repo can be fixed/re-synced without bumping the version.
  apt-repo:
    needs: [check, publish]
    if: |
      always() &&
      (needs.check.outputs.needed == 'true' || github.event.inputs.resync_apt == 'true') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: gh-pages }
      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Download the latest release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir build --clobber
      - name: Import the apt repo signing key
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --pinentry-mode loopback --passphrase '' --import
      - name: Rebuild and sign the apt repository
        run: packaging/publish_apt_repo.sh gh-pages/apt "$(ls build/*.deb)"
      - name: Publish the apt repository
        run: |
          cd gh-pages
          git add apt
          if ! git diff --cached --quiet -- apt/Packages apt/*.deb; then
            git -c user.name="x6100-tci-remote release bot" -c user.email="164936959+amystikis@users.noreply.github.com" \
              commit -m "apt repo: sync to latest release"
            git push origin gh-pages
          fi

  windows:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/*_windows.zip
            build/*_windows.msi

  publish:
    needs: [check, deb, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          # notes = the CHANGELOG section for this version, if present
          awk -v v="$v" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
          gh release create "v$v" assets/* --title "v$v" --notes-file notes.md --target "$GITHUB_SHA"
